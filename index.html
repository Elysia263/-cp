<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邵白之恋 · 小游戏收藏馆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --pink: #ff5fa2;
    --ink: #8a4461;
    --line: #ffd0e3;
  }
  body {
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #fff1f8 0%, #ffe3f1 42%, #ffeef6 100%);
    color: var(--ink);
    padding: 40px 20px 56px;
    -webkit-tap-highlight-color: transparent;
  }
  /* 背景漂浮爱心 */
  .bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .bg i {
    position: absolute;
    display: block;
    width: 18px;
    height: 18px;
    background: var(--pink);
    opacity: .12;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translateY(0) rotate(-45deg) scale(.7); opacity: .05; }
    50%  { opacity: .16; }
    100% { transform: translateY(-110vh) rotate(-45deg) scale(1.3); opacity: 0; }
  }
  .page { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 38px; }
  header .kicker {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 4px;
    color: #c988aa;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 14px;
    margin-bottom: 16px;
    background: rgba(255, 255, 255, .6);
  }
  h1 {
    font-size: clamp(26px, 5vw, 42px);
    letter-spacing: 2px;
    color: var(--pink);
    text-shadow: 0 6px 18px rgba(255, 95, 162, .22);
  }
  h1 em { font-style: normal; color: #ff8fbe; }
  header p {
    margin-top: 12px;
    font-size: 14px;
    color: #b0577f;
    line-height: 1.8;
  }
  header .count {
    margin-top: 14px;
    font-size: 13px;
    color: #c988aa;
  }
  header .count b { color: var(--pink); font-size: 16px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 230px;
    padding: 22px 22px 18px;
    border-radius: 24px;
    background: rgba(255, 255, 255, .82);
    border: 1px solid rgba(255, 255, 255, .9);
    box-shadow: 0 10px 30px rgba(255, 105, 170, .14);
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: transform .22s cubic-bezier(.2, .8, .3, 1), box-shadow .22s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 90% at 100% 0%, var(--glow) 0%, transparent 62%);
    opacity: .55;
    transition: opacity .22s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 18px 40px rgba(255, 105, 170, .24);
  }
  .card:hover::before { opacity: .9; }
  .card:active { transform: translateY(-2px) scale(.99); }

  .card .no {
    position: relative;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
    opacity: .85;
  }
  .card .ico {
    position: relative;
    font-size: 42px;
    line-height: 1;
    margin: 14px 0 12px;
    filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .12));
  }
  .card h2 {
    position: relative;
    font-size: 20px;
    color: #4a2c3a;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .card p {
    position: relative;
    font-size: 13px;
    line-height: 1.75;
    color: #a0708a;
    flex: 1;
  }
  .card .tags {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 14px 0 16px;
  }
  .card .tags span {
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--glow);
    color: var(--accent);
    font-weight: 700;
  }
  .card .go {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 800;
    color: var(--accent);
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .card .go b { transition: transform .22s ease; display: inline-block; }
  .card:hover .go b { transform: translateX(6px); }

  footer {
    margin-top: 48px;
    text-align: center;
    font-size: 12px;
    color: #c9a2b6;
    line-height: 2;
  }
  footer code {
    font-family: inherit;
    color: #b8869d;
    background: rgba(255, 255, 255, .7);
    border-radius: 6px;
    padding: 2px 7px;
  }

  @media (max-width: 560px) {
    body { padding: 26px 14px 40px; }
    .grid { gap: 16px; grid-template-columns: 1fr; }
    .card { min-height: 0; padding: 18px 18px 16px; }
    .card .ico { font-size: 34px; margin: 10px 0; }
  }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <div class="page">
    <header>
      <span class="kicker">SHAO &amp; BAI · GAMES</span>
      <h1>邵白之恋 <em>·</em> 小游戏收藏馆</h1>
      <p>每个游戏住在自己的编号房间里，从这里推门进去。</p>
      <div class="count">共 <b id="total">0</b> 款小游戏</div>
    </header>

    <main class="grid" id="grid"></main>

    <footer>
      想加新游戏？新建 <code>NN-游戏名/index.html</code>，<br>
      再在页面脚本的 <code>GAMES</code> 列表里添一行即可。
    </footer>
  </div>

<script>
(function () {
  'use strict';

  // ---------- 游戏清单：新增游戏只需在这里加一项 ----------
  var GAMES = [
    {
      no: '01',
      name: '爱心贪吃蛇',
      icon: '💗',
      desc: '吃「邵」冒粉色爱心，蛇头是「白」的圆形头像，格子间平滑滑动。',
      tags: ['粉色恋爱风', '键盘 / 滑动', '本地最高分'],
      path: '01-爱心贪吃蛇/index.html',
      accent: '#ff5fa2',
      glow: 'rgba(255, 126, 182, .22)'
    },
    {
      no: '02',
      name: '大鱼吃小鱼',
      icon: '🐟',
      desc: '你是一只「邵」，吃掉小水鬼慢慢长大；比自己大的水鬼会反过来吞了你。挑战 1000 分通关，或无尽模式刷分。',
      tags: ['深海蓝调', '鼠标 / 拖动', '挑战 / 无尽'],
      path: '02-大鱼吃小鱼/index.html',
      accent: '#2ec8c0',
      glow: 'rgba(46, 200, 192, .18)'
    },
    {
      no: '03',
      name: '拯救邵涵睿',
      icon: '🛡️',
      desc: '肉鸽生存：自动开火清怪，升级三选一。偶数波末尾会刷出精英「伤心奶」，6 波起换成「草帽奶」，不清完这波不结束。',
      tags: ['暗红地牢风', 'WASD / 摇杆', '三选一强化'],
      path: '03-拯救邵涵睿/index.html',
      accent: '#ff8f6b',
      glow: 'rgba(255, 143, 107, .18)'
    }
  ];

  var grid = document.getElementById('grid');
  var totalEl = document.getElementById('total');
  totalEl.textContent = GAMES.length;

  var frag = document.createDocumentFragment();
  GAMES.forEach(function (g) {
    var a = document.createElement('a');
    a.className = 'card';
    a.href = g.path;
    a.style.setProperty('--accent', g.accent);
    a.style.setProperty('--glow', g.glow);
    a.innerHTML =
      '<span class="no">NO. ' + g.no + '</span>' +
      '<span class="ico">' + g.icon + '</span>' +
      '<h2>' + g.name + '</h2>' +
      '<p>' + g.desc + '</p>' +
      '<span class="tags">' + g.tags.map(function (t) { return '<span>' + t + '</span>'; }).join('') + '</span>' +
      '<span class="go">进入游戏 <b>→</b></span>';
    frag.appendChild(a);
  });
  grid.appendChild(frag);

  // ---------- 背景漂浮爱心 ----------
  var bg = document.getElementById('bg');
  for (var i = 0; i < 14; i++) {
    var h = document.createElement('i');
    var size = 10 + Math.random() * 22;
    h.style.width = h.style.height = size + 'px';
    h.style.left = Math.random() * 100 + '%';
    h.style.top = (60 + Math.random() * 60) + 'vh';
    h.style.animationDuration = (14 + Math.random() * 16) + 's';
    h.style.animationDelay = '-' + (Math.random() * 20) + 's';
    bg.appendChild(h);
  }
})();
</script>
</body>
</html>
